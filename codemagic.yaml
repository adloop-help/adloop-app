workflows:
  ios-workflow:
    name: iOS Workflow

    environment:
      flutter: stable

      ios_signing:
        distribution_type: app_store
        bundle_identifier: CMTYQTR5LZ.com.example.adloop

    integrations:
      app_store_connect: Codemagic

    scripts:
      - name: Get packages
        script: flutter pub get

      - name: Build IPA
        script: flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa